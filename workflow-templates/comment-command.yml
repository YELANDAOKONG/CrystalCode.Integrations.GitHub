name: Crystal Code comment command
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  issue-reply:
    if: >-
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/cc' || startsWith(github.event.comment.body, '/cc ') ||
       github.event.comment.body == '/code' || startsWith(github.event.comment.body, '/code ') ||
       github.event.comment.body == '/crystal' || startsWith(github.event.comment.body, '/crystal ') ||
       github.event.comment.body == '/crystalcode' || startsWith(github.event.comment.body, '/crystalcode '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: YELANDAOKONG/CrystalCode.Integrations.GitHub@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRYSTAL_API_KEY: ${{ secrets.CRYSTAL_API_KEY }}
        with:
          task: issue-reply
  pull-request-reply:
    if: >-
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/cc' || startsWith(github.event.comment.body, '/cc ') ||
       github.event.comment.body == '/code' || startsWith(github.event.comment.body, '/code ') ||
       github.event.comment.body == '/crystal' || startsWith(github.event.comment.body, '/crystal ') ||
       github.event.comment.body == '/crystalcode' || startsWith(github.event.comment.body, '/crystalcode '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: YELANDAOKONG/CrystalCode.Integrations.GitHub@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRYSTAL_API_KEY: ${{ secrets.CRYSTAL_API_KEY }}
        with:
          task: pull-request-reply
