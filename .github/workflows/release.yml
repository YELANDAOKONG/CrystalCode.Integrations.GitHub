name: Release

on:
  push:
    branches:
      - release
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: linux-arm64
          - os: macos-latest
            rid: osx-arm64
            artifact: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Checkout Crystal
        uses: actions/checkout@v4
        with:
          repository: YELANDAOKONG/Crystal
          path: external/Crystal

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CrystalCode.Integrations.GitHub.sln -p:CrystalRoot=${{ github.workspace }}/external/Crystal

      - name: Test
        run: dotnet test CrystalCode.Integrations.GitHub.sln --configuration Release --no-restore -p:CrystalRoot=${{ github.workspace }}/external/Crystal

      - name: Publish
        run: >
          dotnet publish CrystalCode.Integrations.GitHub.Command/CrystalCode.Integrations.GitHub.Command.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          --output ./publish

      - name: Archive published binary
        if: runner.os != 'Windows'
        run: >
          zip -q -r CrystalCode.Integrations.GitHub-${{ matrix.artifact }}.zip publish

      - name: Archive published binary
        if: runner.os == 'Windows'
        run: >
          Compress-Archive -Path .\publish\* -DestinationPath
          CrystalCode.Integrations.GitHub-${{ matrix.artifact }}.zip

      - name: Upload release asset
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >
          gh release upload "$RELEASE_TAG"
          CrystalCode.Integrations.GitHub-${{ matrix.artifact }}.zip
          --clobber

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CrystalCode.Integrations.GitHub-${{ matrix.artifact }}
          path: publish
          if-no-files-found: error

  action-package:
    name: Linux x64 Action package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: YELANDAOKONG/Crystal
          path: external/Crystal
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish bootstrap and tools
        run: |
          dotnet publish CrystalCode.Integrations.GitHub.Bootstrap/CrystalCode.Integrations.GitHub.Bootstrap.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true --output action-package/bootstrap
          dotnet publish CrystalCode.Integrations.GitHub.Tools/CrystalCode.Integrations.GitHub.Tools.csproj --configuration Release -p:CrystalRoot="$GITHUB_WORKSPACE/external/Crystal" --output action-package/tools/GitHub
          cp -R prompt-attachments action-package/prompt-attachments
      - name: Smoke-test published package without network or model calls
        env:
          CRYSTAL_TEST_BOOTSTRAP: action-package/bootstrap
          CRYSTAL_TEST_TOOLS: action-package/tools/GitHub
        run: python3 scripts/test_bootstrap.py
      - name: Archive Action package
        working-directory: action-package
        run: zip -q -r ../CrystalCode.Integrations.GitHub.Action-linux-x64.zip .
      - name: Upload release package
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" CrystalCode.Integrations.GitHub.Action-linux-x64.zip --clobber
      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: CrystalCode.Integrations.GitHub.Action-linux-x64
          path: CrystalCode.Integrations.GitHub.Action-linux-x64.zip
          if-no-files-found: error
